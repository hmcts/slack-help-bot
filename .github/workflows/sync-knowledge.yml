name: Sync FeePay knowledge

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  sync-knowledge:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: "Az CLI login"
        uses: azure/login@v2
        with:
          client-id: b5e07540-9063-466a-b209-205566156f3e # DTS Developers GitHub Actions ACR Publisher 1
          tenant-id: 531ff96d-0ae9-462a-8d2d-bec7c0b42082 # HMCTS.NET
          allow-no-subscriptions: true

      - task: AzureKeyVault@2
        displayName: "Secrets from Key Vault"
        inputs:
          runAsPreJob: false
          ConnectedServiceName: "DTS-CFTPTL-INTSVC"
          keyVaultName: "cftptl-intsvc"
          secretsFilter: "jira-cloud-id,jira-username,jira-api-token"
        uses: azure/secure-file@v1

      - name: Sync Jira, Confluence, and GitHub sources to Azure AI Search
        run: npm run sync:knowledge
        env:
          JIRA_CLOUD_ID: $(jira-cloud-id)
          JIRA_USERNAME: $(jira-username)
          JIRA_API_TOKEN: $(jira-api-token)
          AZURE_SEARCH_ENDPOINT: ${{ vars.AZURE_SEARCH_ENDPOINT }}
          AZURE_SEARCH_KNOWLEDGE_STORE_INDEX_NAME: ${{ vars.AZURE_SEARCH_KNOWLEDGE_STORE_INDEX_NAME || 'feepay-knowledge-index' }}
